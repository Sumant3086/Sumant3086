# Place this file at: .github/workflows/profile-assets.yml
# in your Sumant3086/Sumant3086 profile repository.
#
# If you already added a separate "snake.yml" from earlier, DELETE it first —
# this one file replaces it and does everything in one place, committed
# straight to your main branch (no separate "output" branch to manage).
#
# What it does, every run:
#   1. Generates the animated snake (light + dark, colored to match the README)
#   2. Generates your GitHub stats card
#   3. Generates your top-languages card
#   4. Commits all three as static SVGs into a "profile/" folder on main
#
# Because this uses YOUR OWN GITHUB_TOKEN, it has its own request budget and
# does not depend on any shared third-party service — nothing here can get
# rate-limited by other people using the same public tool.
#
# Runs once a day automatically, or any time you push to main, or you can
# trigger it manually from the "Actions" tab ("Run workflow" button).

name: update-profile-assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#ff4fd8&color_dots=#1a0033,#3c1361,#5b2fe0,#2f8fe0,#00c2ff
            profile/snake-dark.svg?palette=github-dark&color_snake=#ff4fd8&color_dots=#1a0033,#3c1361,#5b2fe0,#2f8fe0,#00c2ff

      - name: generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=dracula&hide_border=true'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&theme=dracula&hide_border=true'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile stats" || exit 0
          git push
