<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000">
        <animate attributeName="stop-color" values="#000000;#1a0033;#000000" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="35%" stop-color="#1a0033">
        <animate attributeName="stop-color" values="#1a0033;#3c1361;#1a0033" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="65%" stop-color="#2f6fe0">
        <animate attributeName="stop-color" values="#2f6fe0;#00c2ff;#2f6fe0" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00c2ff">
        <animate attributeName="stop-color" values="#00c2ff;#ff4fd8;#00c2ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bgGrad)"/>

  <circle cx="120" cy="70" r="2.5" fill="#ffffff" opacity="0.7">
    <animate attributeName="cy" values="70;200;70" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="160" r="2" fill="#00c2ff" opacity="0.6">
    <animate attributeName="cy" values="160;40;160" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="60" r="2.5" fill="#ff4fd8" opacity="0.7">
    <animate attributeName="cy" values="60;190;60" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="150" r="2" fill="#ffffff" opacity="0.5">
    <animate attributeName="cy" values="150;30;150" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="230" r="2" fill="#7b2ff7" opacity="0.5">
    <animate attributeName="cy" values="230;100;230" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="7.5s" repeatCount="indefinite"/>
  </circle>

  <path d="M0,245 Q150,215 300,242 T600,242 T900,242 T1200,242 L1200,280 L0,280 Z" fill="#000000" opacity="0.28"/>

  <g>
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    <text x="600" y="115" font-family="'Courier New', Consolas, monospace" font-size="58" font-weight="700" fill="#ffffff" text-anchor="middle">SUMANT YADAV</text>
  </g>

  <text x="600" y="165" font-family="'Courier New', Consolas, monospace" font-size="20" fill="#d9c9ff" text-anchor="middle" opacity="0">Full Stack Developer
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.25;0.25;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="165" font-family="'Courier New', Consolas, monospace" font-size="20" fill="#d9c9ff" text-anchor="middle" opacity="0">Competitive Programmer
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.25;0.5;0.5;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="165" font-family="'Courier New', Consolas, monospace" font-size="20" fill="#00c2ff" text-anchor="middle" opacity="0">CF Specialist &#183; 1592 Rating
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5;0.75;0.75;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="165" font-family="'Courier New', Consolas, monospace" font-size="20" fill="#ff4fd8" text-anchor="middle" opacity="0">ICPC 2025 &#183; Global Rank 473
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.75;1" dur="8s" repeatCount="indefinite"/>
  </text>
</svg>
