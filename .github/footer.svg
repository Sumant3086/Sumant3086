<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradFooter" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000">
        <animate attributeName="stop-color" values="#000000;#1a0033;#000000" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="35%" stop-color="#1a0033">
        <animate attributeName="stop-color" values="#1a0033;#3c1361;#1a0033" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="65%" stop-color="#2f6fe0">
        <animate attributeName="stop-color" values="#2f6fe0;#00c2ff;#2f6fe0" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00c2ff">
        <animate attributeName="stop-color" values="#00c2ff;#ff4fd8;#00c2ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" fill="url(#bgGradFooter)"/>

  <path d="M0,30 Q150,5 300,27 T600,27 T900,27 T1200,27 L1200,0 L0,0 Z" fill="#000000" opacity="0.25"/>

  <circle cx="200" cy="95" r="2" fill="#ffffff" opacity="0.6">
    <animate attributeName="cy" values="95;45;95" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="105" r="2" fill="#00c2ff" opacity="0.5">
    <animate attributeName="cy" values="105;55;105" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="90" r="2" fill="#ff4fd8" opacity="0.5">
    <animate attributeName="cy" values="90;40;90" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="100" r="1.8" fill="#7b2ff7" opacity="0.5">
    <animate attributeName="cy" values="100;50;100" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="6.5s" repeatCount="indefinite"/>
  </circle>
</svg>
